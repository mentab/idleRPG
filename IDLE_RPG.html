<!DOCTYPE html>
<html>
<head>
	<title>RPG Game</title>
	<style>
		body {
			font-family: "Courier New", Courier, monospace;
			margin: 0;
			padding: 0;
		}

		/* Define the squared button styles */
		button,
		input {
			display: inline-block;
			padding: 10px 20px;
			margin-bottom: 10px;
			background-color: white;
			border: 1px solid black;
			text-decoration: none;
			color: black;
			text-transform: uppercase;
			font-weight:  bold;
			transition: background-color 0.3s ease;
		}

		/* Add hover effect to the buttons */
		button:hover {
			background-color: #f0f0f0;
		}

		#header-container {
			padding:  20px;
		}

		#game-container {
			display: flex;
			width:  100%;
		}

		#main-screens {
			width: 66%;
			padding: 20px;
		}

		#information-screen {
			width:  100%;
			padding:  20px;
		}

		#game-info {
			flex-grow: 1;
			height: 300px;
			overflow-y: scroll;
			border: 1px solid #ccc;
			padding: 10px;
		}

		#game-info {
			height: 300px;
			overflow-y: scroll;
			border: 1px solid #ccc;
			padding: 10px;
		}
		
		#message-container {
			display: flex;
			flex-direction: column-reverse;
		}

		#inventory {
			margin-top: 20px;
		}
		
		#actions {
			margin-top: 20px;
		}
		
		#buy-screen,
		#sell-screen {
			margin-top: 20px;
		}
		
		#screens {
			margin-top: 20px;
		}
		
		#screens > div {
			margin-top: 20px;
		}
		
		.hidden {
			display: none;
		}

		.equipped,
		.selected {
			font-weight: bold;
		}

		.item {
			cursor: pointer;
		}
	</style>
</head>

	const getEnemyMaxHP = (enemy) => {
		const level = enemy.level;
		if (level % 10 === 0) {
			return Math.floor(20 + (level - 1) * 6);
		} else if (level % 3 === 0) {
			return Math.floor(20 + (level - 1) * 5);
		} else if (level % 2 === 0) {
			return Math.floor(20 + (level - 1) * 4);
		} else {
			return Math.floor(20 + (level - 1) * 3);
		}
	};

		if (level % 10 === 0) {

		} else if (level % 3 === 0) {
			return Math.floor(4 + (level - 1) * 3.4);
		} else if (level % 2 === 0) {

	function checkLevelUp() {
		const currentLevel = player.level;
		const experiencePoints = player.experience;

		for (let i = 0; i < levelUpRequirements.length; i++) {
			const requirement = levelUpRequirements[i];
			if (currentLevel < requirement.level && experiencePoints >= requirement.experience) {
				player.level = requirement.level;
				player.experience = requirement.experience;
				levelUp();
				updatePlayerStats();
				break;
			}
		}
	}

	// Function to generate a random enemy based on player's level
	function generateRandomEnemy() {
		const playerArea = Math.floor(player.level / 10);
		const filteredEnemies = enemies.filter((enemy) => {	
			const levelDifference = player.level - enemy.level;
			const enemyArea = Math.floor(enemy.level / 10);
			// @fixme this is not what i want to do !
			return levelDifference >= 0 && levelDifference <= 5 && playerArea - enemyArea <= 1;
		});
		const randomIndex = Math.floor(Math.random() * filteredEnemies.length);
		return filteredEnemies[randomIndex];
	}

	// Function to generate a random boss based on player's level
	function generateRandomBoss() {
		const filteredBosses = bosses.filter((boss) => boss.level <= player.level + 10);
		const randomIndex = Math.floor(Math.random() * filteredBosses.length);
		return filteredBosses[randomIndex];
	}

	// Function to calculate experience points gained from defeating an enemy
	function calculateExperiencePoints(enemy) {
		const baseExperience = 25;
		const enemyLevel = enemy.level;

		// Calculate the level difference between player and enemy
		const levelDifference = player.level - enemy.level;

		// Determine the adjustment factor based on the level difference
		const adjustmentFactor = levelDifference >= 0 ? 1 / (1 + levelDifference) : 1 - levelDifference / playerLevel;

		// Apply the adjustment factor to the experience points
		const experiencePoints = Math.floor(baseExperience * enemyLevel * adjustmentFactor);

		return experiencePoints;
	}

	function calculateDamageReduction(defense){
		return defense / (defense + 50);
	}

	// Function to handle the battle between the player and an enemy
	function battle(enemy) {
		const maxTurns = 10000;
		let turns = 0;
		const basePlayerDamage = player.damage + calculateEquippedWeaponDamage();
		const basePlayerDefense = player.defense + calculateEquippedArmorDefense();
		const basePlayerAccuracy = player.accuracy + calculateEquippedGlovesAccuracy();
		const basePlayerEvasion = player.evasion + calculateEquippedTrinketEvasion();

		const baseEnemyDamage = getEnemyDamage(enemy);
		const baseEnemyDefense = getEnemyDefense(enemy);
		const baseEnemyAccuracy = getEnemyAccuracy(enemy);
		const baseEnemyEvasion = getEnemyEvasion(enemy);
	
		const playerDamageReduction = calculateDamageReduction(basePlayerDefense);
		const enemyDamageReduction = calculateDamageReduction(baseEnemyDefense);

		const playerDamage = Math.ceil(Math.max(basePlayerDamage * (1 - enemyDamageReduction), 1));
		const enemyDamage = Math.ceil(Math.max(baseEnemyDamage * (1 - playerDamageReduction), 1));

		const playerHitChance = calculateHitChance(playerDamage, baseEnemyDefense, basePlayerAccuracy, baseEnemyEvasion);
		const enemyHitChance = calculateHitChance(enemyDamage, basePlayerDefense, baseEnemyAccuracy, basePlayerEvasion);

	  	while (player.currentHP > 0 && enemy.currentHP > 0 && turns < maxTurns) {
			// Player's Turn
			if (Math.random() < playerHitChance) {
				enemy.currentHP -= playerDamage;
			
				// Apply damage-over-time effect (example)
				// if (Math.random() < 0.2) {
				// const dotDamage = playerDamage * 0.1; // 10% of player's damage
				// enemy.currentHP -= dotDamage;
				// }
				updateGameInfo(`You attack the ${enemy.icon} ${enemy.name} dealing ${playerDamage} damage!`);
			}
			
			// Enemy's Turn
			if (Math.random() < enemyHitChance) {
				player.currentHP -= enemyDamage;
				updateGameInfo(`The ${enemy.icon} ${enemy.name} attack you dealing ${enemyDamage} damage!`);
			}
	
			turns++;
	  	}
	
		if (player.currentHP <= 0) {
			updateGameInfo("You were defeated!");
		} else if (enemy.currentHP <= 0) {
			updateGameInfo(`You defeated the ${enemy.icon} ${enemy.name}!`);
			const lootChance = getEnemyLootChance(enemy);

			if (Math.random() < lootChance) {
				const loot = generateLoot(enemy);
				player.inventory.push(loot);
				updateGameInfo(`You found a loot: ${loot.name}!`);
			}

			if (Math.random() < lootChance * 2) {
				const moneyAmount = enemy.level * 2;
				player.money += moneyAmount;
				updateGameInfo(`You found money : ${moneyAmount}!`);
			}
		} else {
			updateGameInfo("The battle ended in a draw.");
		}
	}

	function calculateHitChance(attackerAttack, defenderDefense, attackerAccuracy, defenderEvasion) {
		const baseHitChance = 0.8; // Base hit chance value
		const maxHitChance = 0.95; // Maximum hit chance value
		const minHitChance = 0.05; // Minimum hit chance value

		// Calculate hit chance modifiers based on attacker's accuracy and defender's evasion
		const accuracyModifier = attackerAccuracy - defenderEvasion;
		const hitChanceModifier = accuracyModifier * 0.01; // Modify hit chance by 1% per point of accuracy difference

		// Calculate hit chance based on attacker's attack, defender's defense, and hit chance modifiers
		let hitChance = baseHitChance + hitChanceModifier;

		// Adjust hit chance based on attack and defense difference
		const attackDefenseDifference = attackerAttack - defenderDefense;
		if (attackDefenseDifference > 0) {
		  hitChance += attackDefenseDifference * 0.005; // Increase hit chance by 0.5% per point of attack-defense difference
		} else {
		  hitChance -= Math.abs(attackDefenseDifference) * 0.005; // Decrease hit chance by 0.5% per point of defense-attack difference
		}

		// Limit hit chance within the minimum and maximum values
		hitChance = Math.max(minHitChance, Math.min(hitChance, maxHitChance));

		return hitChance;
	}

	// Function to generate loot
	function generateLoot(enemy) {
		const level = enemy.level;
		const filteredItems = lootItems.filter((item) => item.level <= level);
		const randomIndex = Math.floor(Math.random() * filteredItems.length);
		return filteredItems[randomIndex];
	}

	// Function to handle leveling up and increasing player stats
	function levelUp() {
		player.maxHP += 5;
		player.currentHP = player.maxHP;
		player.damage += 2;
		player.defense += 2;
		if (player.level % 10 == 0) player.regeneration += 1;
		if (player.level % 5 == 0) player.accuracy += 1;
		if (player.level % 5 == 0) player.evasion += 1;
		updateGameInfo(`Congratulations! You leveled up to level ${player.level}.`);
		updatePlayerStats();
	}

		} else if (item.type === "soulstone") {

			player.trinket = item;
			updateGameInfo(`Equipped trinket: ${item.name}`);

	function usePotion(potion) {
		if (player.currentHP === player.maxHP) {
			updateGameInfo("Your health is already full.");
		} else {
			player.currentHP = Math.min(player.currentHP + potion.heal, player.maxHP);
			updateGameInfo(`You used a ${potion.name} and healed ${potion.heal} HP.`);
			updatePlayerStats();
		}
	}

		const itemIndex = player.inventory.indexOf(item);
		if (itemIndex !== -1) {

	// Function to handle the gambling logic
	function gambleMoney(amount) {
		if (amount <= player.money) {
		const symbols = ["🗡️", "🛡️", "🔮", "👑"]; // Array of symbols representing medieval fantasy elements
		const spinResult = []; // Array to store the spin result
	
		// Spin the slot machine
		for (let i = 0; i < 3; i++) {
			const randomIndex = Math.floor(Math.random() * symbols.length);
			spinResult.push(symbols[randomIndex]);
		}
	
		updateGameInfo("Spinning the slot machine...");
		updateGameInfo("Result: " + spinResult.join(" "));
	
		if (spinResult[0] === spinResult[1] && spinResult[1] === spinResult[2]) {
			// Player wins
			const winnings = amount * 3;
			playerMoney += winnings;
			updateGameInfo("Congratulations! You won " + winnings + " money!");
		} else {
			// Player loses
			playerMoney -= amount;
			updateGameInfo("Oh no! You lost " + amount + " money.");
		}
	
			updateGameInfo("Your current balance is: " + player.money + " money.");
		} else {
			updateGameInfo("Not enough money to gamble.");
		}
	}

			player.currentHP = Math.min(player.maxHP, player.currentHP + player.regeneration + calculateEquippedSoulstoneRegeneration());

		}
	}
