		body {
			font-family: "Courier New", Courier, monospace;

		}

		/* Define the squared button styles */
		button,

			display: inline-block;
			padding: 10px;
			margin-bottom: 10px;
			background-color: white;
			border: 1px solid black;
			text-decoration: none;
			color: black;
			text-transform: uppercase;
			font-weight:  bold;
			transition: background-color 0.3s ease;
		}

		button:hover {
			background-color: #f0f0f0;
		}

			padding: 10px;
		}

		}

			padding: 10px;
		}

		#information-screen {

			padding:  10px;
		}

			height: 300px;
			overflow-y: scroll;
			border: 1px solid #ccc;
			padding: 10px;
		}

		#game-info {

			border: 1px solid #ccc;
			padding: 10px;
		}

		}
		
		#actions {
			margin-top: 10px;
		}
		
		#buy-screen,

			margin-top: 10px;
		}
		
		#screens {
			margin-top: 10px;
		}
		
		#screens > div {
			margin-top: 10px;
		}
		
		.hidden {
			display: none;
		}

		.equipped,
		.selected {
			font-weight: bold;
		}

		.item {
			cursor: pointer;
		}

		.game-message {
			border: 1px solid #000000;
			padding: 5px;
			margin-bottom: 5px;
		}
	</style>

	const getEnemyMaxHP = (enemy) => {
		const level = enemy.level;
		if (level % 10 === 0) {
			return Math.floor(15 + (level - 1) * 6);
		} else if (level % 3 === 0) {
			return Math.floor(15 + (level - 1) * 5);
		} else if (level % 2 === 0) {
			return Math.floor(15 + (level - 1) * 4);
		} else {
			return Math.floor(15 + (level - 1) * 3);
		}
	};

		if (level % 10 === 0) {

	function calculateQuestReward(enemy, numEnemies) {
		const enemyLevel = enemy.level;
		const playerLevel = player.level;
		
		const baseReward = numEnemies * 10; // Base reward based on the number of enemies
		
		// Calculate the level difference modifier
		const levelDifference = playerLevel - enemyLevel;
		let levelModifier = 1;
		
		if (levelDifference > 0) {
			levelModifier -= levelDifference * 0.1;
		}
		
		// Calculate the final reward
		const finalReward = Math.max(1, Math.round(baseReward * levelModifier));
		
		return finalReward;
	}

	function checkLevelUp() {
		const currentLevel = player.level;
		const experiencePoints = player.experience;

		for (let i = 0; i < levelUpRequirements.length; i++) {

			if (currentLevel < requirement.level && experiencePoints >= requirement.experience) {
				player.level = requirement.level;
				player.experience = requirement.experience;
				levelUp();
				updatePlayerStats();
				break;
			}
		}
	}

	// Function to calculate experience points gained from defeating an enemy
	function calculateExperiencePoints(enemy) {
		const baseExperience = 25;
		const enemyLevel = enemy.level;

		// Calculate the level difference between player and enemy
		const levelDifference = player.level - enemy.level;

		// Determine the adjustment factor based on the level difference
		const adjustmentFactor = levelDifference >= 0 ? 1 / (1 + levelDifference) : 1 - levelDifference / playerLevel;

		// Apply the adjustment factor to the experience points
		const experiencePoints = Math.floor(baseExperience * enemyLevel * adjustmentFactor);

		return experiencePoints;
	}

	function calculateDamageReduction(defense){
		return defense / (defense + 50);
	}

	// Function to handle the battle between the player and an enemy
	function battle(enemy) {
		const maxTurns = 10000;
		let turns = 0;
		const basePlayerDamage = player.damage + calculateEquippedWeaponDamage();
		const basePlayerDefense = player.defense + calculateEquippedArmorDefense();
		const basePlayerAccuracy = player.accuracy + calculateEquippedGlovesAccuracy();
		const basePlayerEvasion = player.evasion + calculateEquippedTrinketEvasion();
		const basePlayerCritical = player.critical + calculateEquippedRingCritical();
		const basePlayerAbsorb = player.absorb + calculateEquippedCloakAbsorb();

		const baseEnemyDamage = getEnemyDamage(enemy);
		const baseEnemyDefense = getEnemyDefense(enemy);
		const baseEnemyAccuracy = getEnemyAccuracy(enemy);
		const baseEnemyEvasion = getEnemyEvasion(enemy);
		const baseEnemyCritical = getEnemyCritical(enemy);
		const baseEnemyAbsorb = getEnemyAbsorb(enemy);
	
		const playerDamageReduction = calculateDamageReduction(basePlayerDefense);
		const enemyDamageReduction = calculateDamageReduction(baseEnemyDefense);

		const playerDamage = Math.ceil(Math.max(basePlayerDamage * (1 - enemyDamageReduction), 1));
		const enemyDamage = Math.ceil(Math.max(baseEnemyDamage * (1 - playerDamageReduction), 1));

		const playerHitChance = calculateHitChance(playerDamage, baseEnemyDefense, basePlayerAccuracy, baseEnemyEvasion);
		const enemyHitChance = calculateHitChance(enemyDamage, basePlayerDefense, baseEnemyAccuracy, basePlayerEvasion);

		while (player.currentHP > 0 && enemy.currentHP > 0 && turns < maxTurns) {
			// Player's Turn
			if (Math.random() < playerHitChance) {
				let playerDamageDealt = playerDamage;
				if (Math.random() < player.critical / 100) {
					const criticalMultiplier = 1 + (player.critical / 100);
					playerDamageDealt = Math.ceil(playerDamageDealt * criticalMultiplier);
					updateGameInfo(`Critical Hit! You attack the ${enemy.icon} ${enemy.name} dealing ${playerDamageDealt} damage!`);
				} else {
					updateGameInfo(`You attack the ${enemy.icon} ${enemy.name} dealing ${playerDamageDealt} damage!`);
				}

				// Enemy's Damage Absorption
				if (Math.random() < baseEnemyAbsorb / 100) {
					const absorptionMultiplier = 1 - (baseEnemyAbsorb / 100);
					const absorbedDamage = Math.ceil(playerDamageDealt * (1 - absorptionMultiplier));
					playerDamageDealt -= absorbedDamage;
					updateGameInfo(`The ${enemy.icon} ${enemy.name} absorbed ${absorbedDamage} of your damage!`);
				}

				enemy.currentHP -= playerDamageDealt;
			}

			// Enemy's Turn
			if (Math.random() < enemyHitChance) {
				let enemyDamageDealt = enemyDamage;
				if (Math.random() < enemy.critical / 100) {
					const criticalMultiplier = 1 + (enemy.critical / 100);
					enemyDamageDealt = Math.ceil(enemyDamageDealt * criticalMultiplier);
					updateGameInfo(`Critical Hit! The ${enemy.icon} ${enemy.name} attacks you dealing ${enemyDamageDealt} damage!`);
				} else {
					updateGameInfo(`The ${enemy.icon} ${enemy.name} attacks you dealing ${enemyDamageDealt} damage!`);
				}

				// Apply damage absorption
				if (Math.random() < basePlayerAbsorb / 100) {
					const absorptionMultiplier = 1 - (basePlayerAbsorb / 100);
					const absorbedDamage = Math.ceil(enemyDamageDealt * (1 - absorptionMultiplier));
					enemyDamageDealt -= absorbedDamage;
					updateGameInfo(`You absorbed ${absorbedDamage} of enemy damage!`);
				}
				
				player.currentHP -= enemyDamageDealt;
			}
	
			turns++;
		}
	
		if (player.currentHP <= 0) {
			updateGameInfo("You were defeated!");
		} else if (enemy.currentHP <= 0) {
			updateGameInfo(`You defeated the ${enemy.icon} ${enemy.name}!`);
			const lootChance = getEnemyLootChance(enemy);

			if (Math.random() < lootChance) {
				const loot = generateLoot(enemy.level);
				player.inventory.push(loot);
				updateGameInfo(`You found a loot: ${loot.name}!`);
			}

			if (Math.random() < lootChance * 4) {
				const moneyAmount = enemy.level * 4;
				player.money += moneyAmount;
				updateGameInfo(`You found money : ${moneyAmount}!`);
			}
		} else {
			updateGameInfo("The battle ended in a draw.");
		}
	}

	function calculateHitChance(attackerAttack, defenderDefense, attackerAccuracy, defenderEvasion) {
		const baseHitChance = 0.8; // Base hit chance value
		const maxHitChance = 0.95; // Maximum hit chance value
		const minHitChance = 0.05; // Minimum hit chance value

		// Calculate hit chance modifiers based on attacker's accuracy and defender's evasion
		const accuracyModifier = attackerAccuracy - defenderEvasion;
		const hitChanceModifier = accuracyModifier * 0.01; // Modify hit chance by 1% per point of accuracy difference

		// Calculate hit chance based on attacker's attack, defender's defense, and hit chance modifiers
		let hitChance = baseHitChance + hitChanceModifier;

		// Adjust hit chance based on attack and defense difference
		const attackDefenseDifference = attackerAttack - defenderDefense;
		if (attackDefenseDifference > 0) {
		  hitChance += attackDefenseDifference * 0.005; // Increase hit chance by 0.5% per point of attack-defense difference
		} else {
		  hitChance -= Math.abs(attackDefenseDifference) * 0.005; // Decrease hit chance by 0.5% per point of defense-attack difference
		}

		// Limit hit chance within the minimum and maximum values
		hitChance = Math.max(minHitChance, Math.min(hitChance, maxHitChance));

		return hitChance;
	}

		});
		itemClickHandlers.length = 0;

		// Display items available for purchase
		for (let i = 0; i < filteredItems.length; i++) {
			const item = filteredItems[i];
			const itemElement = document.createElement("div");
			itemElement.textContent = `${item.icon} ${item.name} - Cost: ${getItemCost(item)}`;
			itemElement.classList.add("item");
			itemElement.setAttribute("data-index", i); // Store the index of the item as a data attribute
		
			const clickHandler = () => selectItemToBuy(itemElement);

			itemElement.addEventListener("click", clickHandler);
			itemClickHandlers.push({ element: itemElement, clickHandler });
			shopItems.appendChild(itemElement);
		}
		
		showScreen("buy-screen");
		
		// Set up new event listener for "Buy" button
		buyButton.addEventListener("click", buyButtonClickHandler);
	}

	function buyButtonClickHandler() {
		const selectedItem = document.querySelector("#shop-item-list .selected");
		if (selectedItem) {
		  const itemIndex = parseInt(selectedItem.getAttribute("data-index"));
		  const selectedItemObj = filteredItems[itemIndex];
		  buyItem(selectedItemObj);
		}
	}

	// Function to select an item to buy
	function selectItemToBuy(itemElement) {
		// Remove the "selected" class from all items
		const shopItems = document.getElementById("shop-item-list");
		const items = shopItems.getElementsByClassName("item");
		for (let i = 0; i < items.length; i++) {
			items[i].classList.remove("selected");
		}
	
		// Add the "selected" class to the clicked item
		itemElement.classList.add("selected");
	}

	// Function to buy an item from the shop
	function buyItem(item) {
		const itemCost = getItemCost(item);
		if (player.money >= itemCost) {
			player.money -= itemCost;
			player.inventory.push(item);
			updateGameInfo(`You bought ${item.name}.`);
			updatePlayerStats();
		} else {
			updateGameInfo("Not enough money to buy this item.");
		}
		showBuyScreen();
	}

	function showSellScreen() {
	  const sellScreen = document.getElementById("sell-screen");
	  const sellItems = document.getElementById("sell-item-list");
	  sellItems.innerHTML = "";
	
	  // Clean up previous event listeners
	  const sellButton = document.getElementById("btnSellItem");
	  sellButton.removeEventListener("click", sellButtonClickHandler);
	
	  // Remove previous item click handlers
	  const itemElements = document.querySelectorAll("#sell-item-list .item");
	  itemElements.forEach((itemElement) => {
		itemElement.removeEventListener("click", itemClickHandler);
	  });
	
	  // Display items available for selling
	  for (let i = 0; i < player.inventory.length; i++) {
		const item = player.inventory[i];
		const itemElement = document.createElement("div");
		itemElement.textContent = `${item.icon} ${item.name} - Value: ${calculateItemValue(item)}`;
		itemElement.classList.add("item");
		itemElement.setAttribute("data-index", i); // Store the index of the item as a data attribute
		
		const itemClickHandler = () => {
			selectItemToSell(itemElement);
		};
		itemElement.addEventListener("click", itemClickHandler);
		sellItems.appendChild(itemElement);
	  }
	
	  showScreen("sell-screen");
	
	  // Set up new event listener for "Sell" button
	  sellButton.addEventListener("click", sellButtonClickHandler);
	}
	
	function sellButtonClickHandler() {
		const selectedItem = document.querySelector("#sell-item-list .selected");
		if (selectedItem) {
			const itemIndex = parseInt(selectedItem.getAttribute("data-index"));
			const selectedItemObj = player.inventory[itemIndex];
			sellItem(selectedItemObj);
		}
	}

	// Function to select an item to sell
	function selectItemToSell(itemElement) {
		// Remove the "selected" class from all items
		const sellItems = document.getElementById("sell-item-list");
		const items = sellItems.getElementsByClassName("item");
		for (let i = 0; i < items.length; i++) {
			items[i].classList.remove("selected");
		}
	
		// Add the "selected" class to the clicked item
		itemElement.classList.add("selected");
	}
	
	// Function to calculate the value of an item for selling
	function calculateItemValue(item) {
		return getItemCost(item) / 2;
	}

	// Function to sell an item
	function sellItem(item) {
		const itemIndex = player.inventory.indexOf(item);
		if (itemIndex !== -1) {
			const itemValue = calculateItemValue(item);
			player.money += itemValue;
			player.inventory.splice(itemIndex, 1);
			updateGameInfo(`You sold ${item.name} for ${itemValue} money.`);
			updatePlayerStats();
		}
		showSellScreen();
	}

	// Function to handle the gamble screen
	function showGambleScreen() {
		showScreen("gamble-screen");
	
		const gambleAmountInput = document.getElementById("gamble-amount");
		const gambleButton = document.getElementById("btnGambleMoney");
	
		gambleButton.addEventListener("click", () => {
			const gambleAmount = parseInt(gambleAmountInput.value);
			gambleMoney(gambleAmount);
		});
	}
	
	// Function to handle the gambling logic
	function gambleMoney(amount) {
		if (amount <= player.money) {
			const symbols = ["🗡️", "🛡️", "🔮", "👑"]; // Array of symbols representing medieval fantasy elements
			const spinResult = []; // Array to store the spin result
			
			// Spin the slot machine
			for (let i = 0; i < 3; i++) {
				const randomIndex = Math.floor(Math.random() * symbols.length);
				spinResult.push(symbols[randomIndex]);
			}
			
			updateGameInfo("Spinning the slot machine...");
			updateGameInfo("Result: " + spinResult.join(" "));
			
			if (spinResult[0] === spinResult[1] && spinResult[1] === spinResult[2]) {
				// Player wins
				const winnings = amount * 3;
				player.money += winnings;
				updateGameInfo("Congratulations! You won " + winnings + " money!");
			} else {
				// Player loses
				player.money -= amount;
				updateGameInfo("Oh no! You lost " + amount + " money.");
			}
	
			updateGameInfo("Your current balance is: " + player.money + " money.");
			updatePlayerStats();
		} else {
			updateGameInfo("Not enough money to gamble.");
		}
	}

	// Function to show the specified screen and hide other screens
	function showScreen(screenId) {
		const screens = document.querySelectorAll("#main-screens > div");
		for (let i = 0; i < screens.length; i++) {
			const screen = screens[i];
			if (screen.id === screenId) {
				screen.classList.remove("hidden");
			} else {
				screen.classList.add("hidden");
			}
		}
	}

	// Function to show the main screen
	function showMainScreen() {
		showScreen("main-screen");
	}

	// Function to regenerate player's HP every second
	function regenerateHP() {
		if (player.currentHP < player.maxHP) {
			player.currentHP = Math.min(player.maxHP, player.currentHP + player.regeneration + calculateEquippedSoulstoneRegeneration());
			updatePlayerCurrentHP();
		}
	}
	
	// Function to update player's HP display
	function updatePlayerCurrentHP() {
		const currentHPElement = document.getElementById("playerCurrentHP");
		currentHPElement.textContent = player.currentHP;
	}

	function hpLoop() {
		regenerateHP();

		// Wait for a specified delay before displaying the next message
		setTimeout(hpLoop, hpDelay);
	}

	// Initialize the game
	function init() {
		updatePlayerStats();
		updateGameInfo("Fantasy Clicker Battles");
	
		// Add event listeners to buttons
		document.getElementById("btnAdventure").addEventListener("click", () => {
			startAdventure();
		});
	
		document.getElementById("btnBoss").addEventListener("click", () => {
			startBoss();
		});

		document.getElementById("btnQuest").addEventListener("click", () => {
			startQuest();
		});

		document.getElementById("btnDungeon").addEventListener("click", () => {
			startDungeon();
		});

		document.getElementById("btnInventory").addEventListener("click", () => {
			showInventoryScreen();
		});
	
		document.getElementById("btnBuy").addEventListener("click", () => {
			showBuyScreen();
		});
	
		document.getElementById("btnSell").addEventListener("click", () => {
			showSellScreen();
		});

		document.getElementById("btnGamble").addEventListener("click", () => {
			showGambleScreen();
		});

		document.getElementById("btnLevel").addEventListener("click", () => {
			player.experience += 9999999999;
			checkLevelUp();
		});

		document.getElementById("btnMoney").addEventListener("click", () => {
			player.money += 1000;
			updatePlayerStats();
		});

		const backToMainButtons = document.querySelectorAll(".btnBackToMain");

		backToMainButtons.forEach((button) => {
			button.addEventListener("click", showMainScreen);
		});
	
		// Initialize the game
		updatePlayerStats();
		showMainScreen();

		// Start the HP regeneration loop
		hpLoop();
	}

	init();

	</script>
</body>
</html>
