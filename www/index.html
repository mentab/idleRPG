<!DOCTYPE html>
<html>
<head>
	<title>Fantasy Clicker Battles</title>
	<!--<link rel="stylesheet" href="simple.css">-->
	<link rel="stylesheet" href="custom.css">
	<meta charset="UTF-8">
	<meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height, target-densitydpi=device-dpi, orientation=landscape" />
</head>
<body>	
	<aside id="choose-screens">
		<div id="choose-screen">
			<button id="btnExploration">🗺️ Battle</button>
			<button id="btnChallenge">⚔️ Boss</button>
			<button id="btnMission">🔍 Quest</button>
			<button id="btnDuel">🤼 Duel</button>
			<hr/>
			<button id="btnGamble">🎲 Play (<span id="gambleCost"></span>)</button>
			<button id="btnHeal">💊 Heal</button>
			<hr/>
			<button id="btnAreas">🗺️ Travel</button>
			<button id="btnStats">📊 Stats</button>
			<hr/>
			<button id="btnEquipped">🛡️ Gear</button>
			<button id="btnInventory">🎒 Bag</button>
			<button id="btnBuy">💰 Buy</button>
			<button id="btnSell">💎 Sell</button>
			<button id="btnImprove">🔨 Forge</button>
			<hr/>
			<!-- <button id="btnGather">🌿 Gather</button> -->
			<button id="btnAchievements">🏆 Reward</button>
			<!-- <button id="btnCraft">🔨 Craft</button> -->
			<hr/>
			<button id="btnSave">💾 Save</button>
			<button id="btnLoad">📂 Load</button>
			<button id="btnReset">🔄 Reset</button>
			<hr/>
			<button id="btnExperience">🐞 Exp.</button>
			<button id="btnMoney">🐞 Coins.</button>
		</div>

	</aside>

	<main id="information-screen">
		<h1>🗺️: <span id="playerCurrentArea"></span></h1>
		<div>
			<p id="playerStats">
				🎚️: <span id="playerLevel"></span> |
				💖: <span id="playerCurrentHP"></span>/<span id="playerMaxHP"></span> |
				🌟: <span id="playerExperience"></span>
				<br/>
				💰: <span id="playerMoney"></span>
			</p>
		</div>

		<div id="main-screens">

			<div id="mini-game-screen" class="hidden">
				<h2>Mini Game</h2>
				<div id="game-area"></div>
			</div>

			<div id="areas-screen" class="hidden">
				<h2>Areas</h2>
				<div id="area-list"></div>
			</div>

			<div id="inventory-screen" class="hidden">
				<h2>Inventory</h2>
				<div id="item-list"></div>
			</div>

			<div id="buy-screen" class="hidden">
				<h2>Buy Items</h2>
				<div id="shop-item-list"></div>
			</div>

			<div id="sell-screen" class="hidden">
				<h2>Sell Items</h2>
				<div id="sell-item-list"></div>
			</div>

			<div id="stats-screen" class="hidden">
				<h2>Player Stats</h2>
				<div id="stat-list"></div>
			</div>

			<div id="equipped-screen" class="hidden">
				<h2>Equipped Items</h2>
				<div id="equipped-items-list"></div>
			</div>

			<div id="gather-screen" class="hidden">
				<h2>Gather Resources</h2>
				<div id="gather-item-list"></div>
			</div>

			<div id="crafting-screen" class="hidden">
				<h2>Crafting</h2>
				<p id="crafting-xp">Crafting XP: 0</p>
				<div id="crafting-recipes-list"></div>
			</div>

			<div id="achievements-screen" class="hidden">
				<h2>Achievements</h2>
				<div id="achievements-list"></div>
			</div>

			<div id="improvements-screen" class="hidden">
				<h2>Improvements</h2>
				<div id="improvements-list"></div>
			</div>

			<div id="game-info-screen" class="hidden">
				<div id="game-info-list"></div>
			</div>

		</div>
		
	</main>

	<div id="game-notice-container"></div>

	<script src="index.js" type="module"></script>
</body>
</html>
